<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b1a2b">
<title>야구 퀘스트</title>
<style>
:root{
  --bg:#0b1a2b; --card:#12263d; --line:#1e3a57;
  --field:#2d6a3e; --dirt:#b5763f; --orange:#f0883e;
  --gold:#ffc93c; --green:#3fb950; --red:#f85149;
  --txt:#e6edf3; --sub:#8fa6bd;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:0 0 60px;background:var(--bg);color:var(--txt);
  font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif}

.hd{background:linear-gradient(165deg,#164a2a,#0f3320);padding:14px 16px 16px;
  border-bottom:3px solid var(--dirt)}
.hd h1{margin:0;font-size:19px;color:#fff;letter-spacing:-.5px}
.hd .dt{color:#a8d5b5;font-size:12px;margin-top:3px}

.dia{display:flex;justify-content:center;padding:14px 0 4px}
.diabox{position:relative;width:132px;height:132px;transform:rotate(45deg)}
.base{position:absolute;width:26px;height:26px;background:#1b3d2a;
  border:2px solid #3d6b4d;border-radius:5px;transition:all .3s}
.base.on{background:var(--gold);border-color:#fff;box-shadow:0 0 12px rgba(255,201,60,.7)}
.b1{right:0;top:0}.b2{left:0;top:0}.b3{left:0;bottom:0}.bh{right:0;bottom:0;border-radius:5px}
.dline{position:absolute;background:#2a5540}
.dl1{right:26px;top:11px;height:3px;width:80px}
.dl2{left:11px;top:26px;width:3px;height:80px}
.dl3{left:26px;bottom:11px;height:3px;width:80px}
.dl4{right:11px;top:26px;width:3px;height:80px}
.diatx{text-align:center;font-size:12px;color:#a8d5b5;margin-top:6px}

.board{display:flex;gap:8px;padding:12px 14px 0}
.bx{flex:1;background:#08121e;border:1px solid var(--line);border-radius:12px;
  padding:10px 4px;text-align:center}
.bx .n{font-size:24px;font-weight:800;color:var(--gold);
  font-family:'DS-Digital',monospace;letter-spacing:1px}
.bx .l{font-size:10px;color:var(--sub);margin-top:2px}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:14px;margin:12px 14px 0}
.ttl{font-size:15px;font-weight:800;color:#fff;display:flex;
  align-items:center;justify-content:space-between;gap:8px}
.sub{font-size:12px;color:var(--sub);line-height:1.6}
.eq{font-size:10px;background:#0c2033;color:var(--orange);
  padding:3px 8px;border-radius:8px;font-weight:700;white-space:nowrap}

.btn{width:100%;background:var(--field);color:#fff;border:0;border-radius:11px;
  padding:13px;font-size:14px;font-weight:800;font-family:inherit;margin-top:10px}
.btn:disabled{background:#28405a;color:#7b8fa6}
.btn.gray{background:#1c3550;color:var(--txt)}
.btn.gray.on{background:var(--field)}
.btn.tm{background:var(--orange)}
.btn.sm{padding:9px;font-size:12px}

.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.ch b{font-size:15px}
.cn{background:#1c3550;color:var(--txt);border:0;border-radius:9px;
  width:32px;height:32px;font-size:16px;font-family:inherit}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cd{text-align:center;font-size:10px;color:var(--sub);padding:2px 0}
.cd.s{color:var(--red)}.cd.t{color:#58a6ff}
.cc{aspect-ratio:1/1;border-radius:9px;background:#0b1929;border:1px solid var(--line);
  color:var(--txt);font-size:12px;font-family:inherit;padding:0;display:flex;
  flex-direction:column;align-items:center;justify-content:center}
.cc.e{background:transparent;border:0}
.cc.f{color:#44576b}
.cc.t{border-color:var(--orange);border-width:2px}
.cc.sel{background:#1f6feb;border-color:#1f6feb;color:#fff;font-weight:800}
.cc.done{background:#14401f;border-color:var(--green)}
.cc.shield{background:#1a2f4a;border-color:#58a6ff}
.cc .mk{font-size:8px;height:9px;line-height:1}
.lg{font-size:10px;color:var(--sub);margin-top:9px;text-align:center;line-height:1.7}

.cp{display:flex;align-items:center;gap:9px;padding:10px 0;
  border-bottom:1px solid var(--line);font-size:13px}
.cp:last-child{border-bottom:0}
.cp span{flex:1}
.cp button{background:var(--field);color:#fff;border:0;border-radius:8px;
  padding:6px 11px;font-size:11px;font-weight:700;font-family:inherit}
.gname{font-size:20px;font-weight:800;color:var(--gold);min-height:30px;
  text-align:center;margin:8px 0}

.rc{display:flex;align-items:center;gap:10px;padding:10px 0;
  border-bottom:1px solid var(--line)}
.rc:last-child{border-bottom:0}
.rc .ic{font-size:19px}
.rc .nm{flex:1;font-size:13px}
.rc .vl{font-size:15px;font-weight:800;color:var(--gold)}
.rc button{background:#1c3550;color:var(--txt);border:0;border-radius:8px;
  padding:6px 10px;font-size:11px;font-weight:700;font-family:inherit}

#tm{position:fixed;inset:0;background:#0b1a2b;z-index:99;display:none;
  flex-direction:column;align-items:center;justify-content:center;padding:24px}
#tm.on{display:flex}
.tring{width:212px;height:212px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;background:conic-gradient(var(--orange) 0deg,#1e3a57 0deg)}
.tin{width:180px;height:180px;border-radius:50%;background:#0b1a2b;display:flex;
  flex-direction:column;align-items:center;justify-content:center}
.tnum{font-size:46px;font-weight:800;color:var(--gold)}
.tstep{font-size:13px;color:var(--sub);margin-top:2px}
.tname{font-size:18px;font-weight:800;margin-top:18px;text-align:center}
.tcue{font-size:12px;color:var(--sub);margin-top:6px;text-align:center;
  line-height:1.6;max-width:300px}
.trow{display:flex;gap:9px;margin-top:22px;width:100%;max-width:320px}
.trow button{flex:1;padding:13px;border:0;border-radius:11px;font-size:13px;
  font-weight:800;font-family:inherit;background:#1c3550;color:var(--txt)}
.trow button.main{background:var(--orange);color:#0b1a2b}

details{border-bottom:1px solid var(--line);padding:9px 0}
details:last-child{border-bottom:0}
summary{list-style:none;font-size:13px;display:flex;gap:8px;align-items:center}
summary::-webkit-details-marker{display:none}
summary b{color:var(--orange);font-size:12px;min-width:38px}
summary span{flex:1}
summary i{font-size:11px;color:var(--sub);font-style:normal}
.dt2{font-size:12px;color:var(--sub);padding:8px 0 4px;line-height:1.7}
.dt2 a{color:#58a6ff}
.rest{text-align:center;padding:18px 0;font-size:15px;font-weight:700;color:var(--green)}
</style>
</head>
<body>

<div class="hd">
  <h1>⚾ 야구 퀘스트</h1>
  <div class="dt" id="today"></div>
  <div class="dia"><div class="diabox">
    <div class="dline dl1"></div><div class="dline dl2"></div>
    <div class="dline dl3"></div><div class="dline dl4"></div>
    <div class="base b1" id="bs1"></div>
    <div class="base b2" id="bs2"></div>
    <div class="base b3" id="bs3"></div>
    <div class="base bh" id="bsh"></div>
  </div></div>
  <div class="diatx" id="diatx"></div>
</div>

<div class="board">
  <div class="bx"><div class="n" id="best">0</div><div class="l">BEST</div></div>
  <div class="bx"><div class="n" id="streak">0</div><div class="l">STREAK</div></div>
  <div class="bx"><div class="n" id="shield">0</div><div class="l">🛡️ SHIELD</div></div>
</div>

<div class="card" id="calCard"></div>
<div class="card" id="gachaCard" style="display:none"></div>
<div class="card" id="morningCard"></div>
<div class="card" id="askCard"></div>
<div class="card" id="nightCard"></div>
<div class="card" id="recCard"></div>

<div id="tm">
  <div class="tring" id="tring"><div class="tin">
    <div class="tnum" id="tnum">0</div>
    <div class="tstep" id="tstep"></div>
  </div></div>
  <div class="tname" id="tname"></div>
  <div class="tcue" id="tcue"></div>
  <div class="trow">
    <button id="tpause">일시정지</button>
    <button id="tskip">건너뛰기</button>
    <button id="texit" class="main">그만</button>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
