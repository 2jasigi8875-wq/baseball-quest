<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="theme-color" content="#0d2818">
<title>야구 퀘스트</title>
<style>
:root{
 --bg:#0d2818; --card:#143a24; --line:#1f5233; --grass:#2e7d4f;
 --dirt:#b5793f; --gold:#f2b544; --red:#e05a45; --white:#f4f1e8;
 --txt:#f4f1e8; --sub:#8fae9b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:0 0 70px;background:var(--bg);color:var(--txt);
 font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:15px;line-height:1.5}
button{font-family:inherit;cursor:pointer;border:none}

.hd{padding:18px 16px 14px;text-align:center;
 background:linear-gradient(180deg,#0a1f12,#0d2818);
 border-bottom:2px solid var(--line)}
.hd h1{margin:0;font-size:21px;letter-spacing:1px}
.hd .dt{margin-top:4px;font-size:12px;color:var(--sub);letter-spacing:1px}

.board{display:flex;gap:8px;padding:12px}
.bx{flex:1;background:var(--card);border:1px solid var(--line);
 border-radius:12px;padding:10px 4px;text-align:center}
.bx .n{font-size:22px;font-weight:800;color:var(--gold)}
.bx .l{font-size:11px;color:var(--sub);margin-top:2px}

.card{margin:0 12px 12px;background:var(--card);border:1px solid var(--line);
 border-radius:14px;padding:14px}
.card:empty{display:none}
.ttl{font-size:15px;font-weight:700;margin-bottom:10px;
 padding-bottom:8px;border-bottom:1px dashed var(--line)}

/* 달력 */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .hdc{text-align:center;font-size:10px;color:var(--sub);padding-bottom:2px}
.cel{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;
 justify-content:center;font-size:11px;background:#0f2e1c;color:#58775f}
.cel.ok{background:var(--grass);color:#fff;font-weight:700}
.cel.sh{background:#2f5aa0;color:#fff}
.cel.no{background:#4a2020;color:#c98a7d}
.cel.rest{background:#1a3524;color:#6b8a76}
.cel.tdy{outline:2px solid var(--gold)}
.lgd{margin-top:8px;font-size:10px;color:var(--sub);text-align:center}

/* 미션 */
.ms{display:flex;align-items:center;gap:10px;padding:10px 0;
 border-bottom:1px dashed var(--line)}
.ms:last-child{border-bottom:none}
.ms .em{font-size:24px;width:30px;text-align:center}
.ms .in{flex:1;min-width:0}
.ms .nm{font-size:14px;font-weight:600}
.ms .sb{font-size:11px;color:var(--sub);margin-top:2px}
.ms .go{background:var(--grass);color:#fff;border-radius:8px;
 padding:8px 12px;font-size:12px;font-weight:700}
.ms .chk{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);
 background:#0f2e1c;color:transparent;font-size:16px;font-weight:900}
.ms .chk.on{background:var(--gold);border-color:var(--gold);color:#0d2818}
.sub-b{width:100%;margin-top:10px;background:#0f2e1c;color:var(--sub);
 border:1px solid var(--line);border-radius:9px;padding:9px;font-size:12px}

/* 뽑기 */
.gc{text-align:center}
.gc .tk{font-size:30px;font-weight:800;color:var(--gold)}
.gc .sp{margin-top:8px;background:var(--gold);color:#0d2818;font-weight:800;
 border-radius:10px;padding:12px 26px;font-size:15px}
.gc .sp:disabled{background:#2a4a35;color:#5d7a68}
.cp{display:flex;align-items:center;gap:8px;padding:8px 0;
 border-top:1px dashed var(--line);font-size:13px}
.cp span{flex:1;text-align:left}
.cp button{background:var(--red);color:#fff;border-radius:7px;
 padding:6px 11px;font-size:11px}

/* 기록실 */
.rc{display:flex;align-items:center;gap:8px;padding:9px 0;
 border-bottom:1px dashed var(--line)}
.rc:last-child{border-bottom:none}
.rc .ic{font-size:19px;width:26px;text-align:center}
.rc .nm{flex:1;font-size:13px}
.rc .vl{font-size:14px;font-weight:800;color:var(--gold);margin-right:6px}
.rc button{background:#0f2e1c;color:var(--sub);border:1px solid var(--line);
 border-radius:7px;padding:6px 10px;font-size:11px}

/* 타이머 */
#tm{position:fixed;inset:0;background:#081a0f;z-index:99;
 display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px}
#tm.on{display:flex}
.tring{width:230px;height:230px;border-radius:50%;
 background:conic-gradient(var(--gold) 0%,rgba(255,255,255,.1) 0);
 display:flex;align-items:center;justify-content:center}
.tin{width:196px;height:196px;border-radius:50%;background:#0d2818;
 display:flex;flex-direction:column;align-items:center;justify-content:center}
.tnum{font-size:50px;font-weight:800;color:var(--gold);letter-spacing:1px}
.tstep{font-size:12px;color:var(--sub);margin-top:6px;text-align:center;padding:0 14px}
.tname{margin-top:20px;font-size:17px;font-weight:700}
.tcue{margin-top:10px;font-size:13px;color:var(--sub);text-align:center;
 max-width:300px;line-height:1.6}
.trow{margin-top:28px;display:flex;gap:10px}
.trow button{background:#143a24;color:var(--txt);border:1px solid var(--line);
 border-radius:10px;padding:12px 18px;font-size:13px}
.trow button.main{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
</style>
</head>
<body>

<div class="hd">
  <h1>⚾ 야구 퀘스트</h1>
  <div class="dt" id="today"></div>
</div>

<div class="board">
  <div class="bx"><div class="n" id="streak">0</div><div class="l">연속 일수</div></div>
  <div class="bx"><div class="n" id="best">0</div><div class="l">최고 기록</div></div>
  <div class="bx"><div class="n" id="shield">0</div><div class="l">🛡️ 실드</div></div>
</div>

<div class="card" id="mCard"></div>
<div class="card" id="eCard"></div>
<div class="card" id="gachaCard"></div>
<div class="card" id="calCard"></div>
<div class="card" id="recCard"></div>

<div id="tm">
  <div class="tring" id="tring"><div class="tin">
    <div class="tnum" id="tnum">0</div>
    <div class="tstep" id="tstep"></div>
  </div></div>
  <div class="tname" id="tname"></div>
  <div class="tcue" id="tcue"></div>
  <div class="trow">
    <button id="tpause">일시정지</button>
    <button id="tskip">건너뛰기</button>
    <button id="texit" class="main">그만</button>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
