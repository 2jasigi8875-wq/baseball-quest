<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>야구 퀘스트</title>
<style>
body{margin:0;padding:18px 14px 50px;background:#0d1117;color:#e6edf3;font-family:-apple-system,"Noto Sans KR",sans-serif;}
h1{font-size:20px;margin:0 0 4px}
.sub{color:#8b949e;font-size:13px;line-height:1.5}
.card{background:#161b22;border:1px solid #30363d;border-radius:14px;padding:16px;margin-top:14px}
.fire{text-align:center}
.fire .num{font-size:52px;font-weight:800;color:#f0883e;line-height:1}
.fire .lbl{font-size:13px;color:#8b949e;margin-top:4px}
.ttl{font-size:15px;font-weight:800}
.eq{font-size:11px;background:#21262d;color:#f0883e;padding:3px 8px;border-radius:6px;margin-left:6px}
details{border-bottom:1px solid #21262d;padding:2px 0}
details:last-of-type{border-bottom:0}
summary{padding:11px 0;font-size:14px;list-style:none;display:flex;gap:9px;align-items:baseline;line-height:1.4}
summary::-webkit-details-marker{display:none}
summary b{color:#58a6ff;flex:0 0 46px;font-size:13px}
summary i{color:#6e7681;font-style:normal;font-size:12px;flex:0 0 auto}
.dt{padding:2px 0 12px 55px;font-size:13px;line-height:1.7;color:#adbac7}
.dt a{color:#58a6ff;text-decoration:none}
.btn{width:100%;margin-top:14px;padding:15px;font-size:16px;font-weight:800;font-family:inherit;border:0;border-radius:12px;background:#f0883e;color:#000}
.btn:disabled{background:#238636;color:#fff}
.btn.gray{background:#21262d;color:#e6edf3;border:1px solid #30363d;font-size:14px;padding:13px;margin-top:8px}
.btn.gray.on{background:#1f6feb;color:#fff;border-color:#1f6feb}
.rest{text-align:center;padding:12px 0;font-size:15px;line-height:1.7}
/* ===== 달력 ===== */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head b{font-size:16px}
.cal-nav{background:#21262d;color:#e6edf3;border:1px solid #30363d;border-radius:8px;width:36px;height:36px;font-size:18px;font-family:inherit}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-dow{text-align:center;font-size:11px;color:#8b949e;padding:3px 0}
.cal-dow.sun{color:#f85149}
.cal-dow.sat{color:#58a6ff}
.cal-cell{aspect-ratio:1/1;border-radius:9px;background:#0d1117;border:1px solid #21262d;color:#e6edf3;font-size:13px;font-family:inherit;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.cal-cell.empty{background:transparent;border:0}
.cal-cell.done{background:#1b3a25;border-color:#238636}
.cal-cell.future{color:#484f58}
.cal-cell.today{border-color:#f0883e;border-width:2px}
.cal-cell.sel{background:#1f6feb;border-color:#1f6feb;color:#fff;font-weight:800}
.cal-cell .mk{font-size:9px;line-height:1;height:10px}
.cal-legend{font-size:11px;color:#8b949e;margin-top:10px;text-align:center;line-height:1.7}
/* ===== 뽑기 ===== */
.gbox{text-align:center;padding:4px 0}
.gname{font-size:22px;font-weight:800;color:#f0883e;min-height:34px;line-height:1.3;margin:10px 0}
.cp{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #21262d;font-size:14px}
.cp:last-child{border-bottom:0}
.cp span{flex:1}
.cp button{background:#238636;color:#fff;border:0;border-radius:8px;padding:7px 12px;font-size:12px;font-weight:700;font-family:inherit}
</style>
</head>
<body>
<h1>⚾ 야구 퀘스트</h1>
<div class="sub" id="today"></div>

<div class="card" id="calCard"></div>

<div class="card fire">
  <div class="num" id="streak">0</div>
  <div class="lbl">🔥 연속 성공 일수 (최고 <span id="best">0</span>일)</div>
</div>

<div class="card" id="gachaCard" style="display:none"></div>
<div class="card" id="morningCard"></div>
<div class="card" id="askCard"></div>
<div class="card" id="nightCard"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
